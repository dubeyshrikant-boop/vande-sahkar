name: दैनिक परिपत्रक व शासन निर्णय update

# कधी चालवायचे?
on:
  # दिवसातून ३ वेळा — सकाळी १०:३०, दुपारी ३:३० व सायंकाळी ८:३० (भारतीय वेळ)
  # शासन निर्णय पोर्टलवर GR दिवसभर प्रसिद्ध होतात, म्हणून त्याच दिवशी वेबसाइटवर येतात.
  schedule:
    - cron: '0 5,10,15 * * *'
  # Manual trigger सुद्धा शक्य (Actions tab मधून "Run workflow" button)
  workflow_dispatch:

# Workflow ला permissions द्या
permissions:
  contents: write

# एकावेळी एकच run — दोन runs एकमेकांचे push अडवणार नाहीत
concurrency:
  group: vande-sahkar-update
  cancel-in-progress: false

jobs:
  scrape-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml Pillow

      # एखादा स्रोत अयशस्वी झाल्यास हा step ✗ दाखवतो (GitHub email करतो),
      # पण बाकी स्रोतांचा डेटा खालील steps मध्ये तरीही save होतो.
      - name: Scrape latest circulars & GRs
        id: scrape
        run: python scripts/scrape.py

      - name: Rebuild index.html
        if: ${{ !cancelled() }}
        run: python scripts/build.py

      - name: Commit changes (if any)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "Vande Sahkar Auto-Updater"
          git config user.email "actions@github.com"
          git add data/circulars.json data/last_update.txt index.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "✓ कोणताही बदल नाही — सर्व up-to-date आहे"
          else
            git commit -m "🤖 Auto-update: नवीन परिपत्रके/शासन निर्णय [$(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M')]"
            git pull --rebase origin main
            git push
            echo "✓ नवीन दस्तऐवज git ला push केले"
          fi
